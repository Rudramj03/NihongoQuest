<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NihongoQuest{% endblock %} · NihongoQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23EEF2FF'/><circle cx='50' cy='50' r='28' fill='%23EF4444'/></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="topbar">
  <a href="/" class="brand" aria-label="NihongoQuest home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><circle cx="12" cy="12" r="10" fill="#fff" opacity=".95"/><circle cx="12" cy="12" r="5.5" fill="#EF4444"/></svg>
    </span>
    <span class="brand-name">Nihongo<em>Quest</em></span>
  </a>
  <nav class="mainnav" aria-label="Main">
    <a href="/" data-nav="home">Home</a>
    <a href="/kana" data-nav="kana">Kana</a>
    <a href="/kanji" data-nav="kanji">Kanji</a>
    <a href="/grammar" data-nav="grammar">Grammar</a>
    <a href="/roadmap" data-nav="roadmap">Roadmap</a>
    <a href="/progress" data-nav="progress">Progress</a>
  </nav>
  <div class="topbar-right">
    <span class="xp-chip" id="xpChip" title="Your total XP">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l2.6 6.6L21 9.2l-5 4.4L17.5 21 12 17.3 6.5 21 8 13.6l-5-4.4 6.4-.6L12 2z"/></svg>
      <b id="xpValue">0</b> XP
    </span>
    <button class="icon-btn" id="soundToggle" aria-label="Toggle sound effects" title="Toggle sound">
      <svg id="soundOnIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="soundOffIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
  </div>
</header>

<main id="main" class="page">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>NihongoQuest — learn Japanese from N5 to N1 with games, guides &amp; audio. がんばって！</p>
  <p style="margin-top:8px">
    <a href="/static/app/NihongoQuest.apk" download
       style="color:var(--primary);font-weight:700;text-decoration:none">
      📱 Download the Android app (.apk)
    </a>
  </p>
</footer>

<canvas id="confettiCanvas" aria-hidden="true"></canvas>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/app.js') }}?v=4"></script>
{% block scripts %}{% endblock %}
</body>
</html>
